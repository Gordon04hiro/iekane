# ==============================================================
#  テーマごとのまとめページ（ガイド）
#  手順ごとに、使うツールと読む記事を並べます。記事はファイル名（.md を除く）で書きます。
#  ツールは lifeplan／sell／loan／rent2buy／prepay／souzoku／souzoku2／souzokuzei／akiya／vs
# ==============================================================
buy:
  タイトル: 家を買う前に読むガイド
  検索タイトル: 家を買う前に読むガイド｜予算・ローン・買ったあとのお金
  カテゴリ: 家を買う
  イラスト: buy
  リード: 予算の決め方から、住宅ローンの選び方、買ったあとにかかり続けるお金まで。家を買う前に確かめておきたいことを、順番にまとめました。
  手順:
    - 見出し: 予算を決める
      説明: 「審査で借りられる額」と「無理なく返せる額」は違います。年収や今の家賃から、無理のない予算の目安を出してみましょう。
      ツール: [loan, rent2buy]
      記事: [loan-budget, loan-400man, loan-500man, loan-600man, loan-700man, rent-same-buy]
    - 見出し: 住宅ローンを選ぶ
      説明: 金利のタイプや、住宅ローン控除のしくみを知っておくと、借り方の判断がしやすくなります。
      ツール: [vs, koujo, zoyo, chuko]
      記事: [hendo-kotei, loan-koujo, pair-loan, chuko-yasui-riyu]
    - 見出し: 買ったあとのお金を知る
      説明: 固定資産税や修繕費は、家を持っているかぎりかかり続けます。繰上げ返済や借り換えの考え方も確認しておきましょう。
      ツール: [prepay]
      記事: [koteishisanzei, prepay-which, karikae]
    - 見出し: 家計全体で確かめる
      説明: 教育費や老後まで続けて見ると、本当に無理がないかがわかります。
      ツール: [lifeplan]
      記事: [kyouikuhi]
sell:
  タイトル: 家を売る・住み替えるときのガイド
  検索タイトル: 家を売る・住み替えるときのガイド｜手取り・進め方・必要書類
  カテゴリ: 家を売る
  イラスト: sell
  リード: 家を売ると手元にいくら残るのか、住み替えはどう進めるのか、どんな書類が必要か。売る前に知っておきたいことを順番にまとめました。
  手順:
    - 見出し: 手元に残るお金を知る
      説明: 売れた価格から、仲介手数料・税金・ローンの残りなどを差し引いた「手取り」で考えるのが大切です。
      ツール: [sell, chukai]
      記事: [sell-cost]
    - 見出し: 進め方を決める
      説明: 売り先行か買い先行か、査定をどこに頼むか。住み替えの進め方で、資金計画が変わります。
      ツール: []
      記事: [urisaki-kaisaki, satei-erabikata]
    - 見出し: 書類と手続きを準備する
      説明: 買ったときの書類は、税金の計算にも使います。早めにそろえておきましょう。
      ツール: []
      記事: [sell-shorui]
souzoku:
  タイトル: 相続と実家のガイド
  検索タイトル: 相続と実家のガイド｜生前の準備・手続きの期限・空き家
  カテゴリ: 相続
  イラスト: souzoku
  リード: 元気なうちの準備から、亡くなったあとの手続きの期限、相続した実家をどうするかまで。相続でつまずきやすいところを順番にまとめました。
  手順:
    - 見出し: 元気なうちに準備する
      説明: 財産の把握や家族との話し合いは、早いほど選べる方法が増えます。相続税がかかりそうかも確かめておきましょう。
      ツール: [souzoku, souzokuzei, souzokubun]
      記事: [souzokuzei-check]
    - 見出し: 亡くなったあとの手続き
      説明: 相続放棄は3か月、相続税の申告は10か月など、期限のある手続きがあります。銀行口座の凍結にも注意が必要です。
      ツール: [souzoku2]
      記事: [yokin-touketsu, souzoku-touki]
    - 見出し: 相続した実家をどうするか
      説明: 持ち続ける・貸す・売るで、かかるお金は大きく変わります。売るなら3,000万円の特例の期限にも気をつけましょう。
      ツール: [akiya]
      記事: [jikka-souzoku, akiya-3000, oya-tochi]
money:
  タイトル: これからのお金のガイド
  検索タイトル: これからのお金のガイド｜家計の見通し・教育費・老後資金
  カテゴリ: ライフプラン
  イラスト: money
  リード: 教育費・老後資金・資産づくり。家族のこれからのお金を、95歳まで見通すための考え方とツールをまとめました。
  手順:
    - 見出し: 家計の見通しを立てる
      説明: 収入・支出・住まい・教育費を入れて、95歳までのお金の流れを確かめます。
      ツール: [lifeplan]
      記事: [rougo-shikin]
    - 見出し: 教育費に備える
      説明: 進路によって教育費は大きく変わります。使う時期が決まっているお金なので、早めの準備が安心です。
      ツール: []
      記事: [kyouikuhi]
    - 見出し: 資産をつくる
      説明: NISAとiDeCoの違いを知って、家計に合った使い方を考えましょう。
      ツール: []
      記事: [nisa-ideco]
    - 見出し: 税金の仕組みを使う
      説明: ふるさと納税や住宅ローン控除は、上限や手続きを知っておくと、使い損ねを防げます。
      ツール: [furusato, koujo]
      記事: [furusato-loan-koujo]
