# ==============================================================
#  アフィリエイト広告の置き場所（広告コードはここだけで管理）
#
#  記事の中に {{広告:住宅ローン比較}} のように書くと、ここの広告が入ります。
#  「コード」が空のあいだは、記事に何も表示されません（あとからコードを入れればOK）。
#  広告が入った記事には「PR」の表示と
#  「当サイトはアフィリエイト広告を利用しています」の一文が自動で出ます（ステマ規制への対応）。
#
#  コードの入れ方：ASP（A8.netなど）の管理画面で「広告リンク」のHTMLをコピーし、
#  「コード: |」の次の行から、行頭にスペース4つを付けて貼り付けます。
# ==============================================================

住宅ローン比較:
  見出し: 住宅ローンの金利や条件を比べてみる
  説明: 複数の金融機関の住宅ローンを比べられるサービスです。借り換えの検討にも使えます。
  コード: ""

証券口座:
  見出し: NISAで積立を始めるなら、証券口座を比べてみる
  説明: 手数料や積み立てできる商品は、証券会社によって違います。
  コード: ""

一括査定:
  見出し: 家がいくらで売れそうか、まとめて査定を頼む
  説明: 複数の不動産会社に一度に査定を依頼できるサービスです。売るかどうか決めていなくても使えます。
  コード: ""

ふるさと納税:
  見出し: ふるさと納税の寄附先と返礼品を探す
  説明: 自治体や返礼品を探して、そのまま寄附の申し込みができるサイトです。上限の目安を確かめてから選びましょう。
  コード: ""

空き家買取:
  見出し: 相続した家・空き家の買取価格を調べる
  説明: 古い家や遠方の空き家でも、そのまま買い取ってもらえるか相談できるサービスです。
  コード: ""
