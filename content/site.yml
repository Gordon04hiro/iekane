# サイト全体の設定
url: https://iekane.jp        # ← 取得したドメインに書き換える（最後に / は付けない）
name: イエカネ 家とお金の相談室
contactForm: "https://docs.google.com/forms/d/e/1FAIpQLSfJuvud4JCL3M9MJ5PTbYuTm9Rg05zVdsF_b8DD7D5koEXONQ/viewform"               # GoogleフォームのURLを入れると、お問い合わせボタンが有効になります
analytics: "G-78NZTT9650"                 # GoogleアナリティクスのID（G-XXXXXXX）を入れると計測が始まります
adsense: ""                   # AdSenseの審査が通ったら、パブリッシャーID（ca-pub-XXXX）を入れます

# 運営者のプロフィール（「サイトについて」と各記事の執筆者欄に出ます。本名・会社名は出しません）
運営者:
  名前: イエカネ運営者
  資格: 宅地建物取引士
  実務年数: "4年"     # 運営者本人の実務年数（空欄なら表示しません）
  会社の年数: "13年"   # 所属する不動産会社の業歴（空欄なら表示しません）
  地域: 静岡県西部
  相続の相談: true    # true なら「相続の相談にも対応」と表示

# AdSenseの「広告ユニット」の番号（data-ad-slot の数字）。空欄の枠には何も出ません。
# AdSenseの管理画面 → 広告 → 広告ユニットごと → ディスプレイ広告 で作り、数字だけを貼ります。
# どの枠もスマホ・PCの両方で、画面の幅に合わせた大きさで表示されます。
adslots:
  記事の上: ""      # 記事のリード文のすぐ下
  記事の中: ""      # 記事の途中（見出し2つごと・何か所でも）
  記事の下: ""      # 記事の終わり
  ツールの下: ""    # 各ツールのページの下（計算結果の下）
  一覧の中: ""      # トップページ・記事一覧の途中
