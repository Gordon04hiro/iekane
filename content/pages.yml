# ページごとの「検索結果に出るタイトル」と「説明文」です。
# 説明文は 80〜120 文字くらいが目安です。
home:
  file: index.html
  title: イエカネ 家とお金の相談室｜住まいとお金の無料シミュレーション
  description: 家を買う・売る・相続する前に、お金の見通しを。登録不要で使えるライフプラン診断、売却・住み替え、住宅ローン、相続のチェックシートなど7つの無料ツール。
lifeplan:
  file: lifeplan.html
  title: ライフプラン診断｜95歳までのお金の流れを無料でシミュレーション｜イエカネ
  description: 家族・収入・住まい・資産を入れると、毎年の収支と貯蓄の推移、家計のバランスシート（BS・PL）がわかります。3パターン比較、目標からの逆算、予算と実績の管理も。登録不要。
sell:
  file: sell.html
  title: 売却・住み替えシミュレーター｜家を売ったら手元にいくら残る？｜イエカネ
  description: 仲介手数料・印紙代・税金の計算例を差し引いた手取りと、ローンを返し切れる売却価格、住み替え後のローン返済額を計算。3,000万円控除・買い替え特例・800万円以下の特例に対応。
loan:
  file: loan.html
  title: 住宅ローン・購入予算診断｜年収からいくらまで借りられる？｜イエカネ
  description: 年収と頭金から、無理なく返せる借入額と審査で借りられる上限の目安、物件価格の目安を計算。金利が上がった場合の返済額も確認できます。
souzoku:
  file: souzoku.html
  title: 相続の準備チェックシート（遺す方へ）｜イエカネ
  description: 財産の把握、家・土地の名義、遺言、家族との話し合いなど、相続の準備がどこまでできているかを12問で確認。これからやることのリストがわかります。
souzoku2:
  file: souzoku2.html
  title: 相続の手続きチェックシート（受け継ぐ方へ）期限の一覧つき｜イエカネ
  description: 亡くなった日を入れると、死亡届・相続放棄・相続税・相続登記など20の手続きの期限日と残り日数を一覧に。銀行口座の凍結や解約の手続きも。
akiya:
  file: akiya.html
  title: 相続した家・空き家の診断｜持つ・貸す・売る・解体を比べる｜イエカネ
  description: 相続した家を「そのまま持つ」「貸す」「建物つきで売る」「解体して土地で売る」の4つで、10年間のお金の出入りを比較。相続登記の義務化や空き家の特例も解説。
vs:
  file: vs.html
  title: 賃貸vs持ち家 比べる診断｜生涯の住居費はどちらが得？｜イエカネ
  description: 今の年齢から85歳までの住居費の合計を、賃貸と購入（戸建て・マンション）で比較。最後に残る家の価値も差し引いて比べます。
articles:
  file: articles/index.html
  title: 記事一覧｜住まいとお金の基本｜イエカネ
  description: 家を買う・売る・相続する前に知っておきたい、住まいとお金の基本をまとめた記事の一覧です。
news:
