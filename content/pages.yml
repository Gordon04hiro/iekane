# ページごとの「検索結果に出るタイトル」と「説明文」です。
# 説明文は 80〜120 文字くらいが目安です。
home:
  file: index.html
  title: イエカネ｜住まいとお金の無料シミュレーション（売却・住宅ローン・相続・ライフプラン）
  description: 家を買う・売る・相続する前に、お金の見通しを。登録不要で使えるライフプラン診断、売却・住み替え、住宅ローン、相続のチェックシートなど12の無料ツール。
lifeplan:
  file: lifeplan.html
  title: ライフプランシミュレーション無料｜95歳までの家計の見通し｜イエカネ
  description: 家族・収入・住まい・資産を入れると、毎年の収支と貯蓄の推移、家計のバランスシート（BS・PL）がわかります。3パターン比較、目標からの逆算、予算と実績の管理も。登録不要。
sell:
  file: sell.html
  title: 家の売却 手取りシミュレーション｜住み替え・税金も計算｜イエカネ
  description: 仲介手数料・印紙代・税金の計算例を差し引いた手取りと、ローンを返し切れる売却価格、住み替え後のローン返済額を計算。3,000万円控除・買い替え特例・800万円以下の特例に対応。
loan:
  file: loan.html
  title: 住宅ローン借入可能額シミュレーション｜年収から予算を計算｜イエカネ
  description: 年収と頭金から、無理なく返せる借入額と審査で借りられる上限の目安、物件価格の目安を計算。金利が上がった場合の返済額も確認できます。
rent2buy:
  file: rent2buy.html
  title: 家賃と同じ返済で買える家はいくら？｜家賃から物件価格を計算｜イエカネ
  description: 今の家賃と同じ月々の負担で買える物件価格を計算。管理費・修繕費・固定資産税も差し引いて考えます。金利や家賃を変えた早見表つき。登録不要。
prepay:
  file: prepay.html
  title: 繰上げ返済シミュレーター｜期間短縮と返済額軽減、どちらが得？｜イエカネ
  description: 住宅ローンを繰上げ返済したときに減る利息を、期間短縮型と返済額軽減型で比較。短くなる期間や毎月の返済の変化もわかります。登録不要。
souzokuzei:
  file: souzokuzei.html
  title: 相続税がかかるか簡単チェック｜基礎控除を計算｜イエカネ
  description: 預貯金・自宅・生命保険などの財産の合計が、相続税の基礎控除（3,000万円＋600万円×法定相続人の数）を超えそうかを確認。税額は計算しない、かんたんなチェックです。
koujo:
  file: koujo.html
  title: 住宅ローン控除シミュレーション｜いくら戻る？年ごとの目安｜イエカネ
  description: 借入額・金利・家の種類（長期優良・ZEH・省エネ・中古）から、住宅ローン控除で毎年いくら戻るかの目安を計算。所得税・住民税の上限も考えます。2026〜2030年入居の制度に対応。登録不要。
souzokubun:
  file: souzokubun.html
  title: 法定相続分の計算ツール｜相続の割合と遺留分がわかる｜イエカネ
  description: 配偶者・子ども・親・兄弟姉妹の人数を入れると、法定相続分と遺留分の割合、財産の合計に当てはめた金額の目安がわかります。登録不要・入力は送信されません。
glossary:
  file: glossary.html
  title: 住まいとお金の用語集｜住宅ローン・売却・相続の言葉をやさしく解説｜イエカネ
  description: 返済負担率、取得費、路線価、法定相続分など、家を買う・売る・相続するときに出てくる言葉を、短くやさしく説明します。
souzoku:
  file: souzoku.html
  title: 相続の準備チェックシート（遺す方へ）｜イエカネ
  description: 財産の把握、家・土地の名義、遺言、家族との話し合いなど、相続の準備がどこまでできているかを12問で確認。これからやることのリストがわかります。
souzoku2:
  file: souzoku2.html
  title: 相続の手続きチェックシート（受け継ぐ方へ）期限の一覧つき｜イエカネ
  description: 亡くなった日を入れると、死亡届・相続放棄・相続税・相続登記など20の手続きの期限日と残り日数を一覧に。銀行口座の凍結や解約の手続きも。
akiya:
  file: akiya.html
  title: 相続した空き家シミュレーション｜売る・貸す・持つを比較｜イエカネ
  description: 相続した家を「そのまま持つ」「貸す」「建物つきで売る」「解体して土地で売る」の4つで、10年間のお金の出入りを比較。相続登記の義務化や空き家の特例も解説。
vs:
  file: vs.html
  title: 賃貸と持ち家どっちが得？生涯の住居費シミュレーション｜イエカネ
  description: 今の年齢から85歳までの住居費の合計を、賃貸と購入（戸建て・マンション）で比較。最後に残る家の価値も差し引いて比べます。
articles:
  file: articles/index.html
  title: 記事一覧｜住まいとお金の基本｜イエカネ
  description: 家を買う・売る・相続する前に知っておきたい、住まいとお金の基本をまとめた記事の一覧です。
news:
  file: news.html
  title: お知らせ｜イエカネ
  description: イエカネの更新情報です。
data:
  file: data.html
  title: 使っているデータ｜イエカネ
  description: イエカネのツールが計算に使っている制度・数値と、その出典・見直し時期の一覧です。
about:
  file: about.html
  title: サイトについて｜イエカネ
  description: イエカネは、住まいとお金の決断を落ち着いて考えるための無料ツールと記事のサイトです。
privacy:
  file: privacy.html
  title: プライバシーポリシー｜イエカネ
  description: イエカネのプライバシーポリシーです。
